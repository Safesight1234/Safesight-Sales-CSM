/* ===== tab_historicals.jsx ===== */
/* ============================================================
   Historicals tab — compact, modern cards (2026 look).
   Three metric cards in a responsive grid. Each shows the
   selected-year total, a YoY change chip, and a tight
   quarter×year table with the active year highlighted.
   Bulletproof: every value coerced to a safe number.
   ============================================================ */
(function () {
  const Card = window.Card;
  const YEARS = [2023, 2024, 2025, 2026];
  const QLABELS = ['Q1', 'Q2', 'Q3', 'Q4'];

  function money(v, cur) {
    var n = (typeof v === 'number' && isFinite(v)) ? v : Number(v);
    if (!isFinite(n)) n = 0;
    if (typeof window.fmtK === 'function') { try { return window.fmtK(n, cur); } catch (e) {} }
    return (cur === 'USD' ? '$' : '€') + (Math.round(n / 100) / 10) + 'k';
  }
  function quartersFor(data, y) {
    var arr = (data && typeof data === 'object') ? (data[y] != null ? data[y] : data[String(y)]) : null;
    var out = [0, 0, 0, 0];
    if (Array.isArray(arr)) for (var i = 0; i < 4; i++) {
      var v = arr[i]; out[i] = (typeof v === 'number' && isFinite(v)) ? v : (isFinite(Number(v)) ? Number(v) : 0);
    }
    return out;
  }

  function HistBlock(props) {
    var title = props.title, data = props.data, cur = props.cur, hotYear = props.hotYear;
    var accent = props.accent, soft = props.soft;
    var rows = {}, totals = {};
    YEARS.forEach(function (y) { var q = quartersFor(data, y); rows[y] = q; totals[y] = q[0] + q[1] + q[2] + q[3]; });

    var hot = (totals[hotYear] != null) ? totals[hotYear] : 0;
    var prevY = hotYear - 1;
    // Like-for-like YoY: for the CURRENT (unfinished) year, compare year-to-date
    // against the SAME quarters last year. Completed years use the full year.
    var now = new Date();
    var CURY = now.getFullYear(), CURQ = Math.floor(now.getMonth() / 3);
    var elapsed = hotYear < CURY ? 4 : (hotYear === CURY ? CURQ + 1 : 0);
    var sumN = function (y, n) { var s = 0, r = rows[y] || []; for (var i = 0; i < n; i++) s += (r[i] || 0); return s; };
    var hotLF = sumN(hotYear, elapsed), prevLF = sumN(prevY, elapsed);
    var hasYoY = elapsed > 0 && YEARS.indexOf(prevY) >= 0 && prevLF > 0;
    var delta = hasYoY ? (hotLF - prevLF) / prevLF : 0;
    var up = delta >= 0;
    var pct = Math.round(Math.abs(delta) * 100);
    var partial = hotYear === CURY && elapsed < 4;

    var head = (
      <span className="total tnum" style={{ color: accent }}>{money(hot, cur)}</span>
    );

    var titleEl = (
      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
        <span style={{ width: 8, height: 8, borderRadius: 2, background: accent, display: 'inline-block' }} />
        {title}
      </span>
    );

    var cell = (val, y, strong) => (
      <td key={y} style={{
        textAlign: 'right', padding: '7px 10px', fontVariantNumeric: 'tabular-nums',
        fontSize: 12.5, fontWeight: strong ? 750 : 550,
        color: y === hotYear ? accent : (strong ? 'var(--text)' : 'var(--text-2)'),
        background: y === hotYear ? soft : 'transparent',
      }}>{money(val, cur)}</td>
    );

    return (
      <Card title={titleEl} headRight={head}>
        <table style={{ width: '100%', borderCollapse: 'collapse', marginTop: 4 }}>
          <thead>
            <tr>
              <th style={{ textAlign: 'left', fontSize: 10.5, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--label)', fontWeight: 650, padding: '0 10px 8px 0' }}></th>
              {YEARS.map(function (y) {
                return <th key={y} style={{
                  textAlign: 'right', fontSize: 11, fontWeight: 700, padding: '0 10px 8px',
                  color: y === hotYear ? accent : 'var(--label)',
                  background: y === hotYear ? soft : 'transparent',
                  borderTopLeftRadius: 7, borderTopRightRadius: 7,
                }}>{y}</th>;
              })}
            </tr>
          </thead>
          <tbody>
            {QLABELS.map(function (q, i) {
              return (
                <tr key={q}>
                  <td style={{ padding: '7px 10px 7px 0', fontSize: 12, fontWeight: 600, color: 'var(--text-3)', borderTop: '1px solid var(--border)' }}>{q}</td>
                  {YEARS.map(function (y) {
                    return <td key={y} style={{
                      textAlign: 'right', padding: '7px 10px', fontVariantNumeric: 'tabular-nums',
                      fontSize: 12.5, fontWeight: 550, borderTop: '1px solid var(--border)',
                      color: y === hotYear ? accent : 'var(--text-2)',
                      background: y === hotYear ? soft : 'transparent',
                    }}>{money(rows[y][i], cur)}</td>;
                  })}
                </tr>
              );
            })}
          </tbody>
          <tfoot>
            <tr>
              <td style={{ padding: '9px 10px 0 0', fontSize: 11, fontWeight: 700, letterSpacing: '.04em', textTransform: 'uppercase', color: 'var(--label)' }}>Total</td>
              {YEARS.map(function (y) {
                return <td key={y} style={{
                  textAlign: 'right', padding: '9px 10px 7px', fontVariantNumeric: 'tabular-nums',
                  fontSize: 13, fontWeight: 800, borderTop: '2px solid var(--border-2)',
                  color: y === hotYear ? accent : 'var(--text)',
                  background: y === hotYear ? soft : 'transparent',
                  borderBottomLeftRadius: 7, borderBottomRightRadius: 7,
                }}>{money(totals[y], cur)}</td>;
              })}
            </tr>
          </tfoot>
        </table>
      </Card>
    );
  }

  function HistoricalsTab(props) {
    var ctx = props && props.ctx ? props.ctx : {};
    var cur = ctx.cur || 'EUR';
    var year = ctx.year || 2026;
    var D = window.DATA;
    var H = D && D.historicals ? D.historicals : null;
    if (!H) return <div className="empty" style={{ padding: 40 }}>No historical data yet.</div>;
    return (
      <div className="grid g-3" style={{ marginTop: 20 }}>
        <HistBlock title="New logo" data={H.newLogo}  cur={cur} hotYear={year} accent="var(--green-ink)" soft="var(--green-soft)" />
        <HistBlock title="Upsell"   data={H.upsell}   cur={cur} hotYear={year} accent="var(--blue-ink)"  soft="var(--blue-soft)" />
        <HistBlock title="Combined" data={H.combined} cur={cur} hotYear={year} accent="var(--text)"      soft="var(--surface-2)" />
      </div>
    );
  }

  window.HistoricalsTab = HistoricalsTab;
})();

</script>
  <script type="text/babel">
/* ===== tab_csm.jsx ===== */
/* ============================================================
   CSM tab — renewal book, churn table, renewed contracts
   ============================================================ */
(function () {
  const { useState } = React;
  const { Card, KpiCard, SortableTable } = window;

  /* per-contract notes, saved on this device */
  const NOTES = 'safesight_csm_notes_v1';
  const loadNotes = () => { try { return JSON.parse(localStorage.getItem(NOTES)) || {}; } catch (e) { return {}; } };
  const saveNotes = n => { try { localStorage.setItem(NOTES, JSON.stringify(n)); } catch (e) {} };

  function NoteCell({ value, onCommit }) {
    const [draft, setDraft] = useState(null);
    if (draft === null) return (
      <button className="note-cell" onClick={() => setDraft(value || '')}>
        {value ? <span>{value}</span> : <span className="muted">+ note</span>}
      </button>
    );
    return (
      <input className="note-cell editing" autoFocus value={draft} placeholder="Add a note…"
             onChange={e => setDraft(e.target.value)}
             onBlur={() => { onCommit(draft.trim()); setDraft(null); }}
             onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); else if (e.key === 'Escape') setDraft(null); }} />
    );
  }

  const fmt = v => '€\u202F' + Math.round(v).toLocaleString('nl-NL');
  const isoToEU = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}-${m}-${y}`; };
  const quarterOf = s => 'Q' + (Math.floor(new Date(s).getMonth() / 3) + 1);
  const monthOf = s => new Date(s).getMonth();

  /* ---- Status renewal badge ---- */
  function statusCell(r) {
    const label = r.signed ? 'Won' : r.status;
    if (!label) return <span className="muted">—</span>;
    let cls = 'watch';
    if (label === 'Won') cls = 'healthy';
    else if (label === 'Churn') cls = 'risk';
    return <span className={`tag ${cls}`}>{label}</span>;
  }
  function riskCell(r) {
    if (r.risk === 'Yes') return <span className="tag risk">Yes</span>;
    if (r.risk === 'No') return <span className="sub">No</span>;
    return <span className="muted">—</span>;
  }

  /* ---- Churn kind badge ---- */
  function kindBadge(kind) {
    if (kind === 'lost')     return <span className="tag risk">Churned</span>;
    if (kind === 'partial')  return <span className="tag watch">Partial</span>;
    return <span className="tag" style={{ background: 'var(--surface-3)', color: 'var(--text-2)' }}>Forecast</span>;
  }

  const renewalCategory = c => c.signed ? 'Won' : (c.status === 'Churn' ? 'Churn' : 'Open');

  function CSMTab({ ctx }) {
    const { cur, year, quarters, monthIdx, periodLabel, renewalStatus } = ctx;
    const D = window.DATA || {};
    const [notes, setNotes] = useState(loadNotes);
    const noteKey = r => year + '|' + r.customer;
    const setNote = (r, v) => setNotes(prev => { const next = { ...prev }; if (v) next[noteKey(r)] = v; else delete next[noteKey(r)]; saveNotes(next); return next; });

    /* ---- 1. CONTRACT RENEWAL BOOK — from the Revenue sheet ---- */
    // Contract end dates + ARR come from the Revenue tab (sheet data + manual
    // edits). Teamleader contracts are the fallback for years the sheet lacks.
    const revRows = (window.revenueRowsFor && window.revenueRowsFor(year)) || null;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const parseLocal = iso => { const p = String(iso || '').split('-').map(Number); return (p.length === 3 && p.every(n => !isNaN(n))) ? new Date(p[0], p[1] - 1, p[2]) : null; };
    const toIso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const minusMonths = (iso, m) => {
      const d = parseLocal(iso); if (!d) return '';
      const day = d.getDate();
      d.setMonth(d.getMonth() - m);
      if (d.getDate() !== day) d.setDate(0);      // clamp 31 May -> 30 Nov, not 1 Dec
      return toIso(d);
    };
    const ORD = d => d + (d > 3 && d < 21 ? 'th' : ['th','st','nd','rd'][d % 10] || 'th');
    const MONTHS_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const dateLong = iso => { const d = parseLocal(iso); return d ? ORD(d.getDate()) + ' of ' + MONTHS_L[d.getMonth()] + ' ' + d.getFullYear() : (iso || '—'); };

    const renewalBook = (revRows || []).filter(r => r.end && (parseLocal(r.end) || new Date(r.end)).getFullYear() === year).map(r => {
      const arr = (+r.arrAnnual || 0) + (+r.arrEvent || 0) + (+r.awaiting || 0);
      const contact = minusMonths(r.end, 6);
      const end = parseLocal(r.end) || new Date(r.end);
      const state = end < today ? 'passed' : ((parseLocal(contact) || end) <= today ? 'now' : 'later');
      return { customer: r.customer, sector: r.sector, country: r.country, arr, end: r.end, contact, state,
               quarter: 'Q' + (Math.floor(end.getMonth() / 3) + 1), days: Math.round((end - today) / 86400000) };
    });

    const bookQuarters = ['Q1','Q2','Q3','Q4'].map(q => {
      const rows = renewalBook.filter(r => r.quarter === q);
      return { q, n: rows.length, value: rows.reduce((a, r) => a + r.arr, 0) };
    });
    const bookInScope = renewalBook
      .filter(r => monthIdx != null ? (parseLocal(r.end) || new Date(r.end)).getMonth() === monthIdx : quarters.includes(r.quarter))
      .sort((a, b) => {
        const ea = a.state === 'passed' ? 1 : 0, eb = b.state === 'passed' ? 1 : 0;
        if (ea !== eb) return ea - eb;                       // ended → bottom
        return (parseLocal(a.end) || 0) - (parseLocal(b.end) || 0);   // soonest deadline first
      });
    const contactNow = renewalBook.filter(r => r.state === 'now');

    const bookCols = [
      { key: 'customer', label: 'Customer', sortable: true, render: r => <span className="co">{r.customer}</span> },
      { key: 'sector', label: 'Sector', sortable: true, render: r => <span className="sub">{r.sector || '—'}</span> },
      { key: 'quarter', label: 'Quarter', sortable: true, render: r => <span className="tag" style={{ background: 'var(--surface-3)', color: 'var(--text-2)' }}>{r.quarter}</span> },
      { key: 'end', label: 'Contract ends', sortable: true, sortVal: r => new Date(r.end).getTime(), render: r => <span className="tnum">{dateLong(r.end)}</span> },
      { key: 'contact', label: 'Contact from (6 mo before)', sortable: true, sortVal: r => new Date(r.contact).getTime(), render: r => <span className="tnum sub">{dateLong(r.contact)}</span> },
      { key: 'state', label: 'Action', sortable: true, sortVal: r => ({ now: 0, later: 1, passed: 2 }[r.state]),
        render: r => r.state === 'now' ? <span className="tag risk">Contact now</span>
                   : r.state === 'passed' ? <span className="tag watch">Ended</span>
                   : <span className="tag healthy">In {Math.max(0, Math.round(r.days / 30))} mo</span> },
      { key: 'arr', label: 'ARR at renewal', num: true, sortable: true, render: r => <span className="tnum">{fmt(r.arr)}</span> },
      { key: 'note', label: 'Notes', sortable: false, render: r => <NoteCell value={notes[noteKey(r)]} onCommit={v => setNote(r, v)} /> },
    ];
    const bookFoot = { customer: 'Total', sector: '', quarter: '', end: '', contact: '', state: `${bookInScope.length} contracts`,
      arr: fmt(bookInScope.reduce((a, r) => a + r.arr, 0)), note: '' };

    // Live data from Teamleader; fall back to demo if not yet synced
    const allContracts = (D.contracts && D.contracts.length) ? D.contracts : DEMO_CONTRACTS;

    const ending = allContracts
      .filter(c => new Date(c.endDate).getFullYear() === year)
      .filter(c => monthIdx != null
        ? monthOf(c.endDate) === monthIdx
        : quarters.includes(quarterOf(c.endDate)))
      .filter(c => !renewalStatus || renewalStatus === 'All' || renewalCategory(c) === renewalStatus)
      .sort((a, b) => new Date(a.endDate) - new Date(b.endDate));

    const signedCount = ending.filter(c => c.signed).length;
    const riskCount   = ending.filter(c => c.risk === 'Yes').length;

    // Watchlist: contracts ending within 6 months with no renewal status
    const asOf = new Date(D.asOf || new Date().toISOString().slice(0, 10));
    const in6mo = new Date(asOf); in6mo.setMonth(in6mo.getMonth() + 6);
    const noStatus = allContracts
      .filter(c => { const d = new Date(c.endDate); return d >= asOf && d <= in6mo && !c.signed && !c.status; })
      .sort((a, b) => new Date(a.endDate) - new Date(b.endDate));

    const contractCols = [
      { key: 'customer',  label: 'Customer',              sortable: true, render: r => <span className="co">{r.customer}</span> },
      { key: 'industry',  label: 'Industry',              sortable: true, render: r => <span className="sub">{window.industryName(r.industry) || '—'}</span> },
      { key: 'endDate',   label: 'Verloopdatum contract',  sortable: true, sortVal: r => new Date(r.endDate).getTime(), render: r => <span className="tnum">{isoToEU(r.endDate)}</span> },
      { key: 'owner',     label: 'Representative',         sortable: true, render: r => <span className="sub">{r.owner}</span> },
      { key: 'risk',      label: 'Risk',                   sortable: true, sortVal: r => r.risk === 'Yes' ? 0 : r.risk === 'No' ? 1 : 2, render: riskCell },
      { key: 'status',    label: 'Status renewal',         sortable: true, sortVal: r => (r.signed ? 'Won' : r.status) || 'zzz', render: statusCell },
    ];

    /* ---- 2. CHURN TABLE — same source as Overview tab ---- */
    // Pull from window.DATA.quarters[q].churn for every quarter in scope
    const allQData = ctx.qdata || D.quarters || {};
    let churnRows = [];
    const sheetChurn = (window.revenueChurnFor && window.revenueChurnFor(year)) || [];
    churnRows = sheetChurn
      .filter(c => quarters.includes(c.quarter))
      .filter(c => monthIdx == null || c.mon === monthIdx);
    // Sort: actual first (lost/partial), then forecast; within each group by value desc
    churnRows = [...churnRows].sort((a, b) => {
      const order = { lost: 0, partial: 1, forecast: 2 };
      const oa = order[a.kind] ?? 2, ob = order[b.kind] ?? 2;
      if (oa !== ob) return oa - ob;
      return b.value - a.value;
    });

    const actualChurn   = churnRows.filter(r => r.kind !== 'forecast').reduce((s, r) => s + r.value, 0);
    const forecastChurn = churnRows.filter(r => r.kind === 'forecast').reduce((s, r) => s + r.value, 0);

    const churnCols = [
      { key: 'customer', label: 'Customer',  sortable: true, render: r => <span className="co">{r.customer}</span> },
      { key: 'industry', label: 'Industry',  sortable: true, render: r => <span className="sub">{window.industryName(r.industry) || '—'}</span> },
      { key: 'when',     label: 'Month',     sortable: true, render: r => <span className="tnum">{r.when}</span> },
      { key: 'reason',   label: 'Reason',    sortable: false, render: r => <span className="sub">{r.reason || '—'}</span> },
      { key: 'kind',     label: 'Type',      sortable: true, render: r => kindBadge(r.kind) },
      { key: 'value',    label: 'Value',     sortable: true, render: r => <span className="tnum">{fmt(r.value)}</span> },
    ];

    /* ---- 3. RENEWED CONTRACTS ----------------------------------------------
       Signed renewals from Teamleader: deal CLOSED in the selected year and the
       new contract STARTING in that same year. Shows the new term and value. */
    const addMonthsIso = (iso, m) => {
      const d = parseLocal(iso); if (!d || !m) return '';
      const day = d.getDate(); d.setMonth(d.getMonth() + m); if (d.getDate() !== day) d.setDate(0);
      return toIso(d);
    };
    const monthsBetween = (a, b) => {
      const s = parseLocal(a), e = parseLocal(b); if (!s || !e) return 0;
      return Math.max(0, Math.round((e - s) / (30.44 * 86400000)));
    };
    const renewedRows = (D.renewals || [])
      .filter(r => r.startDate && new Date(r.close).getFullYear() === year && (parseLocal(r.startDate) || {}).getFullYear?.() === year)
      .filter(r => monthIdx == null || new Date(r.close).getMonth() === monthIdx)
      .map(r => {
        const end = r.endDate || addMonthsIso(r.startDate, +r.duration || 0);
        const months = +r.duration || monthsBetween(r.startDate, end);
        return { ...r, end, months, value: r.total || ((+r.arr || 0) + (+r.oneoff || 0) + (+r.onboarding || 0)) };
      })
      .sort((a, b) => b.value - a.value);

    const renewedTotal = renewedRows.reduce((s, r) => s + (r.value || 0), 0);

    const termLabel = m => !m ? '—' : m % 12 === 0 ? (m / 12) + (m === 12 ? ' year' : ' years') : m + ' months';
    const renewedCols = [
      { key: 'customer', label: 'Customer', sortable: true, render: r => <span className="co">{r.customer}</span> },
      { key: 'startDate', label: 'New contract starts', sortable: true, sortVal: r => new Date(r.startDate).getTime(), render: r => <span className="tnum">{dateLong(r.startDate)}</span> },
      { key: 'end', label: 'Runs until', sortable: true, sortVal: r => new Date(r.end || 0).getTime(), render: r => r.end ? <span className="tnum">{dateLong(r.end)}</span> : <span className="muted">—</span> },
      { key: 'months', label: 'Term', sortable: true, render: r => <span className="tag healthy">{termLabel(r.months)}</span> },
      { key: 'owner', label: 'Representative', sortable: true, render: r => <span className="sub">{r.owner}</span> },
      { key: 'close', label: 'Closed', sortable: true, sortVal: r => new Date(r.close).getTime(), render: r => <span className="sub tnum">{isoToEU(r.close)}</span> },
      { key: 'value', label: 'Contract value', num: true, sortable: true, render: r => <span className="tnum" style={{ fontWeight: 700 }}>{fmt(r.value)}</span> },
    ];
    const renewedFoot = { customer: 'Total', startDate: '', end: '', months: `${renewedRows.length} renewals`, owner: '', close: '', value: fmt(renewedTotal) };

    return (
      <React.Fragment>
        {/* ---- KPIs ---- */}
        <div className="grid g-3">
          <KpiCard eyebrow={`CONTRACTS ENDING · ${periodLabel}`} value={revRows ? bookInScope.length : ending.length}
                   sub={<span>up for renewal in this period</span>} />
          <KpiCard eyebrow="CONTACT WINDOW OPEN" dotColor="red" value={contactNow.length} valueRed={contactNow.length > 0}
                   sub={<span>inside 6 months before the end date</span>} />
          <KpiCard eyebrow={`ARR UP FOR RENEWAL · ${year}`} dotColor="green" value={fmt(renewalBook.reduce((a, r) => a + r.arr, 0))}
                   sub={<span>{renewalBook.length} contracts across the year</span>} />
        </div>

        {/* ---- Contracts ending per quarter ---- */}
        <div className="grid g-4">
          {bookQuarters.map(b => (
            <Card key={b.q} className="kpi pad-lg">
              <div className="eyebrow">{b.q} {year} · CONTRACTS ENDING</div>
              <div className="big tnum">{b.n}</div>
              <div className="sub" style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6 }}>
                <span className="lead">{fmt(b.value)} ARR</span>
                <span>{renewalBook.filter(r => r.quarter === b.q && r.state === 'now').length} to contact</span>
              </div>
            </Card>
          ))}
        </div>

        {/* ---- Renewal book (revenue sheet) ---- */}
        <div className="grid g-1">
          <Card title={`Contracts ending in ${year}`}
                count={`${bookInScope.length} contract${bookInScope.length !== 1 ? 's' : ''} · ${periodLabel}`}
                headRight={<span className="sub" style={{ fontSize: 12, whiteSpace: 'nowrap' }}>{revRows ? 'Revenue sheet' : 'no sheet data for this year'}</span>}>
            <div className="scroll-y" style={{ maxHeight: 560 }}>
              <SortableTable columns={bookCols} rows={bookInScope} footer={bookInScope.length ? bookFoot : null} />
              {!bookInScope.length && <div className="empty">No contracts ending in this period</div>}
            </div>
          </Card>
        </div>

        {/* ---- Contact list + Renewed contracts ---- */}
        <div className="grid g-2">
          <Card title="Contact now · inside the 6-month window" count={`${contactNow.length}`}
                total={fmt(contactNow.reduce((a, r) => a + r.arr, 0))}>
            <div className="scroll-y" style={{ maxHeight: 340 }}>
              {contactNow.length ? (
                <div className="cw-grid">
                  {[...contactNow].sort((a, b) => (parseLocal(a.end) || 0) - (parseLocal(b.end) || 0)).map((c, i) => {
                    const wk = Math.max(0, Math.round(c.days / 7));
                    const urg = c.days <= 30 ? 'hot' : c.days <= 90 ? 'warm' : 'cool';
                    return (
                      <div className={`cw ${urg}`} key={i} title={`${c.customer} · ends ${dateLong(c.end)} · ${fmt(c.arr)}`}>
                        <i />
                        <span className="nm">{c.customer}</span>
                        <span className="dl tnum">{c.days <= 0 ? 'now' : wk <= 8 ? wk + 'w' : Math.round(c.days / 30) + 'mo'}</span>
                      </div>
                    );
                  })}
                </div>
              ) : <div className="empty">No contract is inside its 6-month contact window</div>}
            </div>
          </Card>

          {/* ---- Renewed contracts ---- */}
          <Card title={`Renewed contracts · ${year}`} count={`${renewedRows.length} signed`} total={fmt(renewedTotal)}
                headRight={<span className="sub" style={{ fontSize: 12, whiteSpace: 'nowrap' }}>closed &amp; starting in {year}</span>}>
            <div className="scroll-y" style={{ maxHeight: 340 }}>
              <SortableTable columns={renewedCols} rows={renewedRows} footer={renewedRows.length ? renewedFoot : null} />
              {!renewedRows.length && <div className="empty">No renewals closed and starting in {year}</div>}
            </div>
          </Card>
        </div>

        {/* ---- Churn table ---- */}
        <div className="grid g-1">
          <Card title="Churn" count={
            <span>
              <span style={{ color: 'var(--red)' }}>{fmt(actualChurn)} actual</span>
              {forecastChurn > 0 && <span className="sub" style={{ marginLeft: 8 }}>+ {fmt(forecastChurn)} forecast</span>}
            </span>
          }>
            <div className="scroll-y" style={{ maxHeight: 480 }}>
              <SortableTable columns={churnCols} rows={churnRows} initialSort={{ key: 'kind', dir: 'asc' }} />
              {!churnRows.length && <div className="empty">No churn in this period</div>}
            </div>
          </Card>
        </div>
      </React.Fragment>
    );
  }

  /* ---- Demo contracts (fallback when no live data yet) ---- */
  const DEMO_CONTRACTS = [
    { customer: 'Liquicity',                  endDate: '2025-12-31', owner: 'Eva de Vre',     risk: 'Yes', status: 'Churn',              signed: false },
    { customer: 'Flowfirm',                   endDate: '2026-01-31', owner: 'Casper Derks',   risk: '',    status: 'Churn',              signed: false },
    { customer: 'PEC Zwolle',                 endDate: '2026-01-31', owner: 'Casper Derks',   risk: '',    status: 'Churn',              signed: false },
    { customer: 'Matrixx Events',             endDate: '2026-03-31', owner: 'Casper Derks',   risk: '',    status: 'Churn',              signed: false },
    { customer: 'Sagro Decom',                endDate: '2026-04-30', owner: 'Eva de Vre',     risk: 'Yes', status: 'Churn',              signed: false },
    { customer: 'NVT Betonrenovatie',         endDate: '2026-05-31', owner: 'Casper Derks',   risk: '',    status: 'Churn',              signed: false },
    { customer: 'Dutchbase',                  endDate: '2026-12-31', owner: 'Casper Derks',   risk: '',    status: '',                   signed: false },
    { customer: 'Stichting Vierdaagsefeesten',endDate: '2025-12-31', owner: 'Casper Derks',   risk: '',    status: 'Won',                signed: true  },
    { customer: 'Jens Security',              endDate: '2026-01-31', owner: 'Eva de Vre',     risk: 'No',  status: 'Won',                signed: true  },
    { customer: 'Johan Cruijff ArenA',        endDate: '2026-04-30', owner: 'Eva de Vre',     risk: 'No',  status: 'Won',                signed: true  },
    { customer: 'AZ Alkmaar',                 endDate: '2026-06-30', owner: 'Casper Derks',   risk: '',    status: '',                   signed: false },
    { customer: 'FC Twente',                  endDate: '2026-06-30', owner: 'Casper Derks',   risk: '',    status: 'Verbal agreement',   signed: false },
    { customer: 'Messe München',              endDate: '2026-06-30', owner: 'Casper Derks',   risk: '',    status: '',                   signed: false },
    { customer: 'Valencia CF',                endDate: '2026-06-30', owner: 'Casper Derks',   risk: '',    status: '',                   signed: false },
    { customer: 'Jaarbeurs Holding',          endDate: '2026-06-11', owner: 'Eva de Vre',     risk: 'No',  status: 'Proposal',           signed: false },

/* ===== summary.jsx ===== */
/* ============================================================
   Year comparison summary — generated from the data (no API).
   Compares the selected year with the previous year and writes
   an analyst-style note: totals, the NL/Upsell split, quarter
   winners & soft spots, churn impact, and takeaways for next year.
   Exposes window.buildYearSummary(year, cur) and window.SummaryModal.
   ============================================================ */
(function () {
  const QL = ['Q1', 'Q2', 'Q3', 'Q4'];

  function arr(o, y) {
    var a = o && (o[y] != null ? o[y] : o[String(y)]);
    return Array.isArray(a) ? a.map(function (n) { return +n || 0; }) : [0, 0, 0, 0];
  }
  function sumN(a, n) { var s = 0; for (var i = 0; i < n; i++) s += (a[i] || 0); return s; }
  function pctChange(cur, prev) {
    if (prev > 0) return Math.round((cur - prev) / prev * 100);
    return cur > 0 ? 100 : 0;
  }
  function churnYear(D, y) {
    var q = (D.quartersByYear || {})[y] || (D.quartersByYear || {})[String(y)];
    var perQ = QL.map(function (k) {
      var rows = (q && q[k] && q[k].churn) ? q[k].churn : [];
      return rows.filter(function (c) { return c.kind !== 'forecast'; })
                 .reduce(function (a, c) { return a + (+c.value || 0); }, 0);
    });
    return { perQ: perQ, total: perQ.reduce(function (a, b) { return a + b; }, 0) };
  }

  window.buildYearSummary = function (year, cur) {
    var D = window.DATA || {};
    var H = D.historicals || {};
    var prev = year - 1;
    var fmt = function (v) { return window.fmtK ? window.fmtK(v, cur) : v; };

    var now = new Date(), CURY = now.getFullYear(), CURQ = Math.floor(now.getMonth() / 3);
    var elapsed = year < CURY ? 4 : (year === CURY ? CURQ + 1 : 4);
    var partial = (year === CURY && elapsed < 4);

    var comb = arr(H.combined, year), combP = arr(H.combined, prev);
    var nl = arr(H.newLogo, year),  nlP = arr(H.newLogo, prev);
    var up = arr(H.upsell, year),   upP = arr(H.upsell, prev);

    var T = sumN(comb, elapsed), TP = sumN(combP, elapsed);
    var NLt = sumN(nl, elapsed),  NLp = sumN(nlP, elapsed);
    var UPt = sumN(up, elapsed),  UPp = sumN(upP, elapsed);
    var hasPrev = TP > 0;

    var ch = churnYear(D, year), chP = churnYear(D, prev);

    // quarter analysis (over elapsed quarters)
    var qList = QL.slice(0, elapsed);
    var best = -1, bestV = -Infinity, weak = -1, weakV = Infinity;
    var topGain = -1, topGainV = -Infinity, topDrop = -1, topDropV = Infinity;
    for (var i = 0; i < elapsed; i++) {
      if (comb[i] > bestV) { bestV = comb[i]; best = i; }
      if (comb[i] < weakV) { weakV = comb[i]; weak = i; }
      var d = comb[i] - combP[i];
      if (d > topGainV) { topGainV = d; topGain = i; }
      if (d < topDropV) { topDropV = d; topDrop = i; }
    }

    var salesPct = pctChange(T, TP);
    var nlPct = pctChange(NLt, NLp), upPct = pctChange(UPt, UPp);
    var churnPctOfSales = T > 0 ? Math.round(ch.total / T * 100) : 0;

    // ---- narrative bullets ----
    var bullets = [];
    if (hasPrev) {
      var dir = salesPct >= 0 ? 'up' : 'down';
      bullets.push({
        tone: salesPct >= 0 ? 'good' : 'bad',
        text: 'Total sales ' + dir + ' ' + Math.abs(salesPct) + '% vs ' + prev +
              ' — ' + fmt(T) + ' against ' + fmt(TP) + ' (' + (T - TP >= 0 ? '+' : '') + fmt(T - TP) + ').'
      });
      // what drove it
      var driver = Math.abs(NLt - NLp) >= Math.abs(UPt - UPp) ? 'New logo' : 'Upsell';
      bullets.push({
        tone: 'neutral',
        text: 'New logo ' + fmt(NLt) + ' (' + (nlPct >= 0 ? '+' : '') + nlPct + '%), Upsell ' + fmt(UPt) +
              ' (' + (upPct >= 0 ? '+' : '') + upPct + '%). ' + driver + ' moved the needle most.'
      });
    } else {
      bullets.push({ tone: 'neutral', text: 'No ' + prev + ' data on record, so this is a standalone view of ' + year + '.' });
      bullets.push({ tone: 'neutral', text: 'Total sales ' + fmt(T) + ' — New logo ' + fmt(NLt) + ', Upsell ' + fmt(UPt) + '.' });
    }

    // quarters
    if (best >= 0) {
      var qtxt = 'Strongest quarter was ' + QL[best] + ' (' + fmt(comb[best]) + ')';
      if (weak >= 0 && weak !== best) qtxt += '; ' + QL[weak] + ' was the soft spot (' + fmt(comb[weak]) + ').';
      else qtxt += '.';
      bullets.push({ tone: 'neutral', text: qtxt });
    }
    if (hasPrev && topGain >= 0 && topGainV > 0) {
      bullets.push({ tone: 'good', text: QL[topGain] + ' improved most vs ' + prev + ' (+' + fmt(topGainV) + ').' });
    }
    if (hasPrev && topDrop >= 0 && topDropV < 0) {
      bullets.push({ tone: 'bad', text: QL[topDrop] + ' slipped the most vs ' + prev + ' (' + fmt(topDropV) + ').' });
    }

    // churn
    if (ch.total > 0) {
      var cTone = churnPctOfSales >= 15 ? 'bad' : (churnPctOfSales >= 8 ? 'warn' : 'neutral');
      var cText = 'Churn was ' + fmt(ch.total) + ' (' + churnPctOfSales + '% of sales)';
      if (chP.total > 0) {
        var cp = pctChange(ch.total, chP.total);
        cText += ', ' + (cp >= 0 ? 'up ' + cp + '%' : 'down ' + Math.abs(cp) + '%') + ' vs ' + prev + ' (' + fmt(chP.total) + ').';
      } else cText += '.';
      // worst churn quarter
      var wq = -1, wv = -1; ch.perQ.forEach(function (v, i) { if (v > wv) { wv = v; wq = i; } });
      if (wq >= 0 && wv > 0) cText += ' Heaviest in ' + QL[wq] + ' (' + fmt(wv) + ').';
      bullets.push({ tone: cTone, text: cText });
    }

    // ---- takeaways for next year ----
    var takeaways = [];
    if (hasPrev) {
      if (upPct > nlPct + 10) takeaways.push('Expansion (upsell) is outpacing new business — keep investing in the customer base.');
      else if (nlPct > upPct + 10) takeaways.push('New logo is the growth engine — protect top-of-funnel and onboarding capacity.');
      if (topDrop >= 0 && topDropV < 0) takeaways.push('Plan earlier for ' + QL[topDrop] + ' — it underperformed ' + prev + '; build pipeline ahead of it.');
    }
    if (churnPctOfSales >= 10) takeaways.push('Churn is material (' + churnPctOfSales + '% of sales) — prioritise renewals and at-risk accounts.');
    if (best >= 0) takeaways.push('Repeat what worked in ' + QL[best] + ' — it was the standout quarter.');
    if (!takeaways.length) takeaways.push('Steady year — hold the course and watch renewal timing into next year.');

    return {
      year: year, prev: prev, partial: partial, hasPrev: hasPrev,
      T: T, TP: TP, salesPct: salesPct,
      NLt: NLt, UPt: UPt, churnTotal: ch.total,
      bullets: bullets, takeaways: takeaways, cur: cur, fmt: fmt
    };
  };

  function SummaryModal(props) {
    var year = props.year, cur = props.cur, onClose = props.onClose;
    var s = window.buildYearSummary(year, cur);
    var toneColor = { good: 'var(--green-ink)', bad: 'var(--red-ink)', warn: 'var(--amber)', neutral: 'var(--text-3)' };
    var up = s.salesPct >= 0;
    return (
      <div onClick={onClose} style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(10,12,14,.45)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
        <div onClick={function (e) { e.stopPropagation(); }} className="card" style={{ maxWidth: 620, width: '100%', padding: 0, boxShadow: 'var(--shadow-pop)', maxHeight: '88vh', overflowY: 'auto' }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', padding: '20px 24px 14px' }}>
            <div>
              <div className="eyebrow">Year comparison{s.partial ? ' · year-to-date' : ''}</div>
              <h3 className="card-title" style={{ marginTop: 4 }}>{s.year} vs {s.prev}</h3>
            </div>
            <button className="btn icon" onClick={onClose} title="Close">{window.__I_close || '✕'}</button>
          </div>

          <div style={{ padding: '0 24px 8px' }}>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, flexWrap: 'wrap' }}>
              <span className="tnum" style={{ fontSize: 34, fontWeight: 800, letterSpacing: '-.02em' }}>{s.fmt(s.T)}</span>
              {s.hasPrev && (
                <span style={{
                  fontSize: 13, fontWeight: 700, padding: '4px 10px', borderRadius: 999,
                  color: up ? 'var(--green-ink)' : 'var(--red-ink)',
                  background: up ? 'var(--green-soft)' : 'var(--red-soft)'
                }}>{up ? '▲' : '▼'} {Math.abs(s.salesPct)}% vs {s.prev}</span>
              )}
            </div>
            <div className="sub" style={{ marginTop: 6, color: 'var(--text-3)', fontSize: 12.5 }}>
              New logo {s.fmt(s.NLt)} · Upsell {s.fmt(s.UPt)}{s.churnTotal > 0 ? ' · Churn ' + s.fmt(s.churnTotal) : ''}
            </div>
          </div>

          <div style={{ padding: '14px 24px 8px' }}>
            <div className="eyebrow" style={{ marginBottom: 8 }}>Key differences</div>
            <ul style={{ listStyle: 'none', margin: 0, padding: 0, display: 'flex', flexDirection: 'column', gap: 10 }}>
              {s.bullets.map(function (b, i) {
                return (
                  <li key={i} style={{ display: 'flex', gap: 10, alignItems: 'flex-start', fontSize: 13.5, lineHeight: 1.5 }}>
                    <span style={{ flex: '0 0 auto', width: 7, height: 7, borderRadius: 2, marginTop: 6, background: toneColor[b.tone] || 'var(--text-3)' }} />
                    <span style={{ color: 'var(--text)' }}>{b.text}</span>
                  </li>
                );
              })}
            </ul>
          </div>

          <div style={{ padding: '12px 24px 24px' }}>
            <div style={{ background: 'var(--green-soft)', border: '1px solid var(--green)', borderRadius: 'var(--r, 12px)', padding: '14px 16px' }}>
              <div className="eyebrow" style={{ color: 'var(--green-ink)', marginBottom: 8 }}>Take into next year</div>
              <ul style={{ listStyle: 'none', margin: 0, padding: 0, display: 'flex', flexDirection: 'column', gap: 8 }}>
                {s.takeaways.map(function (t, i) {
                  return (
                    <li key={i} style={{ display: 'flex', gap: 9, alignItems: 'flex-start', fontSize: 13.5, lineHeight: 1.5, color: 'var(--green-ink)' }}>
                      <span style={{ fontWeight: 800 }}>→</span><span>{t}</span>
                    </li>
                  );
                })}
              </ul>
            </div>
            <div className="sub" style={{ marginTop: 12, color: 'var(--text-3)', fontSize: 11.5 }}>
              Generated from dashboard figures{s.partial ? ' · current year compares year-to-date against the same quarters last year' : ''}.
            </div>
          </div>
        </div>
      </div>
    );
  }

  window.SummaryModal = SummaryModal;
})();

</script>

  const monthsRunning = (y, start, end) => {

  const wonDeals = () => {

    if (draft === null) {
      const money = num && +value;
      const show = num ? (money ? Math.round(+value).toLocaleString('en-US') : '—')
                       : date ? (dateLabel(value) || '—') : (value || '—');
      return (
        <button className={`cell ${num ? 'num' : ''} ${num && !+value ? 'zero' : ''}`}
                onClick={() => setDraft(num ? String(+value || '') : (value || ''))}>
          {money ? <span className="cur">€</span> : null}<span className="amt">{show}</span>
        </button>
      );
    }
    return (
      <input className={`cell ${num ? 'num' : ''}`} autoFocus value={draft}
             type={num ? 'number' : date ? 'date' : 'text'} step={num ? '0.01' : undefined}
             onChange={e => setDraft(e.target.value)}
             onBlur={() => { onCommit(num ? (parseFloat(draft) || 0) : draft.trim()); setDraft(null); }}
             onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); else if (e.key === 'Escape') setDraft(null); }} />
    );
  }

  const caret = open => (
    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"
         style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform .15s', marginLeft: 3, verticalAlign: 'middle' }}><path d="M6 9l6 6 6-6" /></svg>
  );

  /* monthly licence: editable amount, plus a note that shows on hover */
  function LicenceCell({ value, note, onValue, onNote }) {
    const [editing, setEditing] = useState(null);   // 'amount' | 'note' | null
    const [draft, setDraft] = useState('');
    const start = (what, v) => { setDraft(v == null ? '' : String(v)); setEditing(what); };
    if (editing === 'amount' || editing === 'note') {
      const isNote = editing === 'note';
      return (
        <input className={`cell ${isNote ? '' : 'num'}`} autoFocus value={draft}
               type={isNote ? 'text' : 'number'} step={isNote ? undefined : '0.01'}
               placeholder={isNote ? 'Note (shown on hover)' : ''}
               onChange={e => setDraft(e.target.value)}
               onBlur={() => { isNote ? onNote(draft.trim()) : onValue(parseFloat(draft) || 0); setEditing(null); }}
               onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); else if (e.key === 'Escape') setEditing(null); }} />
      );
    }
    return (
      <div className={`lic ${note ? 'has-note' : ''}`}>
        <button className={`cell num ${+value ? '' : 'zero'}`} onClick={() => start('amount', +value || '')}>
          {+value ? <span className="cur">€</span> : null}<span className="amt">{+value ? Math.round(+value).toLocaleString('en-US') : '—'}</span>
        </button>
        {note && <span className="lic-tip">{note}</span>}
        <button className="lic-note" title={note ? 'Edit note' : 'Add note'} onClick={() => start('note', note || '')}>{note ? '●' : '+'}</button>
      </div>
    );
  }

  function RevenueTab() {
    const [year, setYear] = useState(2026);
    const [rows, setRows] = useState(() => rowsFor(2026));
    const [edited, setEdited] = useState(() => !!loadRows(2026));
    const [undo, setUndo] = useState(() => hasBackup(2026));
    const [q, setQ] = useState('');
    const [sector, setSector] = useState('All sectors');
    const [menu, setMenu] = useState(null);
    const [sort, setSort] = useState({ key: 'total', dir: 'desc' });
    const [showLicence, setShowLicence] = useState(true);
    const sortBy = key => setSort(s => s.key === key ? { key, dir: s.dir === 'desc' ? 'asc' : 'desc' } : { key, dir: typeof (rows[0] || {})[key] === 'string' ? 'asc' : 'desc' });
    const sortVal = (r, key) => key === 'total' ? rowTotal(r) : (typeof r[key] === 'string' ? r[key].toLowerCase() : (+r[key] || 0));
    const barRef = useRef(null);

    /* on open: adopt the server copy of any year whose saved edits are newer
       than this device's */
    useEffect(() => {
      let live = true;
      pullEdits().then(data => {
        if (!live || !data || !data.years) return;
        let changed = false;
        Object.keys(data.years).forEach(y => {
          const s = data.years[y];
          if (!s || !Array.isArray(s.rows) || !s.rows.length) return;
          if ((+s.ts || 0) > localTs(+y)) { writeLocal(+y, s.rows, +s.ts || Date.now()); changed = true; }
        });
        if (changed) { setRows(rowsFor(year)); setEdited(!!loadRows(year)); }
      });
      return () => { live = false; };
    }, []);

    useEffect(() => {
      if (!menu) return;
      const off = e => { if (barRef.current && !barRef.current.contains(e.target)) setMenu(null); };
      document.addEventListener('mousedown', off);
      return () => document.removeEventListener('mousedown', off);
    }, [menu]);

    const pickYear = y => { setYear(y); setRows(rowsFor(y)); setEdited(!!loadRows(y)); setMenu(null); setUndo(hasBackup(y)); };
    const persist = next => {
      const ts = Date.now();
      setRows(next); setEdited(true);
      writeLocal(year, next, ts);
      pushEdits(year, next, ts);          // server copy - survives redeploys and other devices
      try { window.dispatchEvent(new CustomEvent('revenue-edited')); } catch (e) {}
    };
    const setCell = (id, key, val) => persist(rows.map(r => r.id === id ? { ...r, [key]: val, manual: true } : r));
    const addRow = () => persist([blank(), ...rows]);
    const delRow = id => persist(rows.filter(r => r.id !== id));
    const reset = () => {
      try { const cur = localStorage.getItem(STORE(year)); if (cur) localStorage.setItem(STORE(year) + '_bak', cur); localStorage.removeItem(STORE(year)); localStorage.removeItem(STORE(year) + '_ts'); } catch (e) {}
      setRows(rowsFor(year)); setEdited(false); setUndo(true);
      pushEdits(year, [], Date.now());        // clear the server copy too
    };
    const undoReset = () => {
      try { const bak = localStorage.getItem(STORE(year) + '_bak'); if (bak) { localStorage.setItem(STORE(year), bak); const back = JSON.parse(bak); const ts = Date.now(); localStorage.setItem(STORE(year) + '_ts', String(ts)); pushEdits(year, back, ts); } } catch (e) {}
      setRows(rowsFor(year)); setEdited(!!loadRows(year)); setUndo(false);
    };

    const sectors = useMemo(() => ['All sectors', ...[...new Set(rows.map(r => r.sector).filter(Boolean))].sort()], [rows]);
    const view = useMemo(() => {
      const list = rows.filter(r =>
        (sector === 'All sectors' || r.sector === sector) &&
        (!q || (r.customer + ' ' + r.sector + ' ' + r.country).toLowerCase().includes(q.toLowerCase())));
      const d = sort.dir === 'asc' ? 1 : -1;
      // customers whose only figure is churn always sink to the bottom
      const churnOnly = r => (+r.churn || 0) > 0 &&
        NUMS.every(([k]) => k.slice(0,5) === 'churn' || !(+r[k] || 0));
      return list.sort((a, b) => {
        const ca = churnOnly(a) ? 1 : 0, cb = churnOnly(b) ? 1 : 0;
        if (ca !== cb) return ca - cb;
        const av = sortVal(a, sort.key), bv = sortVal(b, sort.key);
        return av < bv ? -d : av > bv ? d : 0;
      });
    }, [rows, q, sector, sort]);
    const sortArrow = key => sort.key === key ? <span className="arr">{sort.dir === 'desc' ? '▼' : '▲'}</span> : <span className="arr dim">▽</span>;

    const sum = (list, k) => list.reduce((a, r) => a + (+r[k] || 0), 0);
    const T = {}; NUMS.forEach(([k]) => { T[k] = sum(rows, k); });
    T.sponsorship = sum(rows, 'sponsorship');
    const arrTotal = T.arrAnnual + T.arrEvent;
    const grand = TOTAL_COLS.reduce((a, k) => a + T[k], 0);

    const bySector = useMemo(() => {
      const m = {};
      rows.forEach(r => { const k = r.sector || 'Unassigned'; m[k] = m[k] || { v: 0, n: 0 }; m[k].v += rowTotal(r); m[k].n++; });
      return Object.entries(m).map(([name, g]) => ({ name, value: g.v, tail: g.n + ' customers' }))
        .filter(r => r.value > 0).sort((a, b) => b.value - a.value);
    }, [rows]);

    const vT = {}; NUMS.forEach(([k]) => { vT[k] = sum(view, k); });
    const maxRow = Math.max(...rows.map(rowTotal), 1);

    return (
      <React.Fragment>
        {/* ---- one row of equal tiles: KPIs + dropdowns ---- */}
        <div className="rev-tiles" ref={barRef}>
          <div className="rk"><span className="eyebrow">ARR TOTAL · {year}</span><span className="v">{eur(arrTotal)}</span>
            <span className="s">{eur(T.arrAnnual)} + {eur(T.arrEvent)} event</span></div>
          <div className="rk"><span className="eyebrow">AWAITING RENEWAL</span><span className="v">{eur(T.awaiting)}</span>
            <span className="s">not yet re-signed</span></div>
          <div className="rk"><span className="eyebrow">CHURN</span><span className="v red">{eur(T.churn)}</span>
            <span className="s">{eur(T.upsell)} upsell</span></div>
          <div className="rk"><span className="eyebrow">ONE-OFF · ONB.</span><span className="v">{eur(T.oneoff + T.onboarding)}</span>
            <span className="s">{eur(T.oneoff)} + {eur(T.onboarding)}</span></div>
          <div className="rk accent"><span className="eyebrow">TOTAL (75%) SAFESIGHT</span><span className="v">{eur(grand)}</span>
            <span className="s">{eur(grand + T.sponsorship)} after sponsorship</span></div>

          <div className={`rk rk-drop ${menu === 'sector' ? 'on' : ''}`} role="button" tabIndex={0}
               onClick={() => setMenu(m => m === 'sector' ? null : 'sector')}
               onKeyDown={e => { if (e.key === 'Enter') setMenu(m => m === 'sector' ? null : 'sector'); }}>
            <span className="eyebrow">BY SECTOR {caret(menu === 'sector')}</span>
            <span className="v">{bySector.length}</span>
            <span className="s">{bySector[0] ? bySector[0].name : '—'} leads</span>
            {menu === 'sector' && (
              <div className="drop-panel" onClick={e => e.stopPropagation()}>
                <HBarList rows={bySector} cur="EUR" color="green" emptyText="No rows" />
              </div>
            )}
          </div>

          <div className={`rk rk-drop ${menu === 'comp' ? 'on' : ''}`} role="button" tabIndex={0}
               onClick={() => setMenu(m => m === 'comp' ? null : 'comp')}
               onKeyDown={e => { if (e.key === 'Enter') setMenu(m => m === 'comp' ? null : 'comp'); }}>
            <span className="eyebrow">COMPONENTS {caret(menu === 'comp')}</span>
            <span className="v">{NUMS.length}</span>
            <span className="s">breakdown of total</span>
            {menu === 'comp' && (
              <div className="drop-panel right" onClick={e => e.stopPropagation()}>
                <div className="comp-list">
                  {NUMS.map(([k, label]) => (
                    <div className="comp-row" key={k}><span className="lbl">{label}</span><span className="val">{eur(T[k])}</span></div>
                  ))}
                  <div className="comp-row tot"><span className="lbl">Total (75%) Safesight</span><span className="val">{eur(grand)}</span></div>
                  <div className="comp-row"><span className="lbl sub">Sponsorship (outside total)</span><span className="val sub">{eur(T.sponsorship)}</span></div>
                  <div className="comp-row"><span className="lbl sub">After sponsorship</span><span className="val sub">{eur(grand + T.sponsorship)}</span></div>
                </div>
              </div>
            )}
          </div>
        </div>

        {/* ---- editable table ---- */}
        <div className="grid g-1">
          <Card title={`Revenue ${year}`} count={`${view.length} of ${rows.length} customers`} total={eur(view.reduce((a, r) => a + rowTotal(r), 0))}>
            <div className="rev-tools">
              <div className="seg">
                {YEARS.map(y => <button key={y} aria-pressed={year === y} onClick={() => pickYear(y)}>{y}</button>)}
              </div>
              <input className="input" placeholder="Search customer, sector, country…" value={q} onChange={e => setQ(e.target.value)} />
              <select className="select" value={sector} onChange={e => setSector(e.target.value)}>
                {sectors.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <button className="btn" aria-pressed={showLicence} onClick={() => setShowLicence(v => !v)}
                      title="Monthly licence column">{showLicence ? 'Hide' : 'Show'} monthly licence</button>
              <button className="btn" onClick={addRow}>+ Add customer</button>
              <button className="btn" onClick={reset} disabled={!edited} title="Restore the numbers from the Excel sheet">Reset to sheet</button>
              {undo && <button className="btn" onClick={undoReset} title="Put your manual edits back">Undo reset</button>}
              <span className="spacer" style={{ marginLeft: 'auto' }} />
              <span className="rev-note">{edited ? 'Manual edits saved' : 'Click any cell to edit'}</span>
            </div>
            <div className="rev-wrap">
              <table className="rev">
                <thead>
                  <tr>
                    <th className="sticky-l sortable" onClick={() => sortBy('customer')}>Customer {sortArrow('customer')}</th>
                    <th className="sortable" onClick={() => sortBy('sector')}>Sector {sortArrow('sector')}</th>
                    <th className="sortable" onClick={() => sortBy('country')}>Country {sortArrow('country')}</th>
                    <th className="sortable" onClick={() => sortBy('end')}>End date contract {sortArrow('end')}</th>
                    <th>Invoicing</th>
                    {showLicence && <th className="num sortable lic-col" onClick={() => sortBy('license')}>Monthly licence {sortArrow('license')}</th>}
                    {NUMS.map(([k, label]) => <th key={k} className={`num sortable ${k.slice(0,5) === 'churn' ? 'churn-col' : ''}`} onClick={() => sortBy(k)}>{label} {sortArrow(k)}</th>)}
                    <th className="num tot sortable" onClick={() => sortBy('total')}>Total {sortArrow('total')}</th>
                    <th className="num sortable" onClick={() => sortBy('sponsorship')}>Sponsorship {sortArrow('sponsorship')}</th>
                    <th />
                  </tr>
                </thead>
                <tbody>
                  {view.map(r => {
                    const tot = rowTotal(r);
                    return (
                      <tr key={r.id}>
                        <td className="sticky-l">
                          <Cell value={r.customer} onCommit={v => setCell(r.id, 'customer', v)} />
                          <i className="rowbar" style={{ width: Math.max(2, (tot / maxRow) * 100) + '%', background: SECTOR_COLOR[r.sector] || 'var(--gray-series)' }} />
                        </td>
                        <td>
                          <span className="sect"><i style={{ background: SECTOR_COLOR[r.sector] || 'var(--gray-series)' }} />
                            <Cell value={r.sector} onCommit={v => setCell(r.id, 'sector', v)} /></span>
                        </td>
                        <td><Cell value={r.country} onCommit={v => setCell(r.id, 'country', v)} /></td>
                        <td><Cell kind="date" value={r.end} onCommit={v => setCell(r.id, 'end', v)} /></td>
                        <td><Cell value={r.invoicing} onCommit={v => setCell(r.id, 'invoicing', v)} /></td>
                        {showLicence && (
                          <td className="lic-col">
                            <LicenceCell value={r.license} note={r.licenseNote}
                                         onValue={v => setCell(r.id, 'license', v)}
                                         onNote={v => setCell(r.id, 'licenseNote', v)} />
                          </td>
                        )}
                        {NUMS.map(([k]) => <td key={k} className={k.slice(0,5) === 'churn' ? 'churn-col' : ''}><Cell kind="money" value={r[k]} onCommit={v => setCell(r.id, k, v)} /></td>)}
                        <td className="num tot"><span className="cur">€</span><span className="amt">{Math.round(tot).toLocaleString('en-US')}</span></td>
                        <td><Cell kind="money" value={r.sponsorship} onCommit={v => setCell(r.id, 'sponsorship', v)} /></td>
                        <td><button className="rowdel" title="Delete row" onClick={() => delRow(r.id)}>×</button></td>
                      </tr>
                    );
                  })}
                </tbody>
                <tfoot>
                  <tr>
                    <td className="sticky-l">Total{view.length !== rows.length ? ' (filtered)' : ''}</td>
                    <td /><td /><td /><td />
                    {showLicence && <td className="num lic-col"><span className="cur">€</span><span className="amt">{Math.round(sum(view, 'license')).toLocaleString('en-US')}</span></td>}
                    {NUMS.map(([k]) => <td key={k} className={`num ${k.slice(0,5) === 'churn' ? 'churn-col' : ''}`}><span className="cur">€</span><span className="amt">{Math.round(vT[k]).toLocaleString('en-US')}</span></td>)}
                    <td className="num tot"><span className="cur">€</span><span className="amt">{Math.round(view.reduce((a, r) => a + rowTotal(r), 0)).toLocaleString('en-US')}</span></td>
                    <td className="num"><span className="cur">€</span><span className="amt">{Math.round(sum(view, 'sponsorship')).toLocaleString('en-US')}</span></td>
                    <td />
                  </tr>
                </tfoot>
              </table>
              {!view.length && <div className="empty">No customers match this filter</div>}
            </div>
          </Card>
        </div>
      </React.Fragment>
    );
  }

  window.RevenueTab = RevenueTab;
  window.revenueRowsFor = y => (YEARS.includes(+y) ? rowsFor(+y) : null);
  /* the Revenue tab's own totals — single source of truth for other tabs */
  window.revenueTotalsFor = y => {
    if (!YEARS.includes(+y)) return null;
    const rows = rowsFor(+y), s = k => rows.reduce((a, r) => a + (+r[k] || 0), 0);
    const t = {}; NUMS.forEach(([k]) => { t[k] = s(k); });
    t.sponsorship = s('sponsorship');
    t.grand = TOTAL_COLS.reduce((a, k) => a + t[k], 0);      // churn excluded
    return t;
  };
  window.REVENUE_YEARS = YEARS;
  const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  /* churn rows for the Overview tab, straight from the revenue sheet */
  window.revenueChurnFor = y => {
    if (!YEARS.includes(+y)) return null;
    /* contract dates for a sheet row: the row's own, else the matching won deal
       in Teamleader, else derived backwards from the end date + duration */
    const dealFor = name => wonDeals().find(d => norm(d.customer || d.name) === norm(name));
    const minusMonths = (iso, m) => {
      const p = String(iso || '').split('-').map(Number);
      if (p.length !== 3 || p.some(isNaN) || !m) return '';
      const dt = new Date(p[0], p[1] - 1, p[2]);
      const day = dt.getDate(); dt.setMonth(dt.getMonth() - Number(m));
      if (dt.getDate() < day) dt.setDate(0);
      return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    };
    return rowsFor(+y).filter(r => (+r.churn || 0) > 0).map(r => {
      const m = monthOfIso(r.end);
      const d = (!r.start || !r.duration) ? dealFor(r.customer) : null;
      const duration = +r.duration || (d && +d.duration) || 0;
      const start = r.start || (d && d.startDate) || minusMonths(r.end, duration);
      return { customer: r.customer, industry: r.sector, value: +r.churn || 0, kind: 'lost',
               when: m == null ? '' : MON3[m], mon: m, quarter: m == null ? 'Q1' : 'Q' + (Math.floor(m / 3) + 1),
               startDate: start || '', duration: duration, endDate: r.end || '',
               reason: 'Revenue sheet' };
    });
  };
})();

</script>
